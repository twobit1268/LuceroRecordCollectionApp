services:
  catalog-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vinylvault
      POSTGRES_PASSWORD: vinylvault
      POSTGRES_DB: catalog_db
    ports:
      - "5532:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vinylvault"]
      interval: 2s
      timeout: 3s
      retries: 20

  collection-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vinylvault
      POSTGRES_PASSWORD: vinylvault
      POSTGRES_DB: collection_db
    ports:
      - "5533:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vinylvault"]
      interval: 2s
      timeout: 3s
      retries: 20

  activity-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vinylvault
      POSTGRES_PASSWORD: vinylvault
      POSTGRES_DB: activity_db
    ports:
      - "5534:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vinylvault"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Official GCP Pub/Sub emulator — the messaging service. The same
  # cloud.google.com/go/pubsub client code in collection-service and
  # activity-service targets this locally (via PUBSUB_EMULATOR_HOST) and
  # real GCP Pub/Sub in production, unmodified.
  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:emulators
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=vinylvault-local
    ports:
      - "8185:8085"

  catalog-service:
    build: ./services/catalog
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      DATABASE_URL: postgres://vinylvault:vinylvault@catalog-db:5432/catalog_db?sslmode=disable
    depends_on:
      catalog-db:
        condition: service_healthy

  collection-service:
    build: ./services/collection
    ports:
      - "8082:8082"
    environment:
      PORT: "8082"
      DATABASE_URL: postgres://vinylvault:vinylvault@collection-db:5432/collection_db?sslmode=disable
      CATALOG_SERVICE_URL: http://catalog-service:8081
      GCP_PROJECT_ID: vinylvault-local
      PUBSUB_TOPIC: collection-events
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
    depends_on:
      collection-db:
        condition: service_healthy
      catalog-service:
        condition: service_started
      pubsub-emulator:
        condition: service_started

  activity-service:
    build: ./services/activity
    ports:
      - "8083:8083"
    environment:
      PORT: "8083"
      DATABASE_URL: postgres://vinylvault:vinylvault@activity-db:5432/activity_db?sslmode=disable
      CATALOG_SERVICE_URL: http://catalog-service:8081
      GCP_PROJECT_ID: vinylvault-local
      PUBSUB_TOPIC: collection-events
      PUBSUB_SUBSCRIPTION: activity-service-sub
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
    depends_on:
      activity-db:
        condition: service_healthy
      catalog-service:
        condition: service_started
      pubsub-emulator:
        condition: service_started

  web:
    build:
      context: ./web
      args:
        VITE_CLOUDBEES_SDK_KEY: ${VITE_CLOUDBEES_SDK_KEY:-}
    ports:
      - "5173:80"
    depends_on:
      - catalog-service
      - collection-service
      - activity-service
