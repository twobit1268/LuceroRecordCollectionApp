apiVersion: v1
kind: ConfigMap
metadata:
  name: activity-service-config
data:
  PORT: "8083"
  CATALOG_SERVICE_URL: "http://catalog-service:8081"
  GCP_PROJECT_ID: "your-real-gcp-project-id"
  PUBSUB_TOPIC: "collection-events"
  PUBSUB_SUBSCRIPTION: "activity-service-sub"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: activity-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: activity-service
  template:
    metadata:
      labels:
        app: activity-service
    spec:
      containers:
        - name: activity-service
          image: REGION-docker.pkg.dev/PROJECT_ID/vinylvault/activity-service:latest
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: activity-service-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: activity-db-credentials
                  key: database-url
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8083
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8083
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: activity-service
spec:
  selector:
    app: activity-service
  ports:
    - port: 8083
      targetPort: 8083
