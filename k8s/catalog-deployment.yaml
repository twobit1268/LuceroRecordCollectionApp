# Deploy target: GKE. Image path assumes Artifact Registry
# (REGION-docker.pkg.dev/PROJECT_ID/vinylvault/catalog-service) — replace
# PROJECT_ID/REGION for your own project. DATABASE_URL is intentionally NOT
# in the ConfigMap: it belongs in a Secret (e.g. `kubectl create secret
# generic catalog-db-credentials --from-literal=database-url=...`), created
# out-of-band and never committed to this repo.
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-service-config
data:
  PORT: "8081"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
        - name: catalog-service
          image: REGION-docker.pkg.dev/PROJECT_ID/vinylvault/catalog-service:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: catalog-service-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: catalog-db-credentials
                  key: database-url
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
spec:
  selector:
    app: catalog-service
  ports:
    - port: 8081
      targetPort: 8081
