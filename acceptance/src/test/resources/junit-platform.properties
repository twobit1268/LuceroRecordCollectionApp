# Cucumber configuration, read by the cucumber-junit-platform-engine.
# (This file is how you configure Cucumber when it runs under the JUnit
#  Platform - there is no cucumber.properties needed.)

# Where the step definitions and hooks live.
cucumber.glue=com.vinylvault.acceptance

# Console output + machine-readable reports written under target/.
cucumber.plugin=pretty, html:target/cucumber-report/cucumber.html, json:target/cucumber-report/cucumber.json, junit:target/cucumber-report/cucumber.xml

# Readable scenario names in IDE / Surefire test trees.
cucumber.junit-platform.naming-strategy=long

# Don't print the "share your report at reports.cucumber.io" banner.
cucumber.publish.quiet=true
