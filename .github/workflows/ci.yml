name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [catalog, collection, activity]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Vet
        working-directory: services/${{ matrix.service }}
        run: go vet ./...
      - name: Test
        working-directory: services/${{ matrix.service }}
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [catalog, collection, activity]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t vinylvault-${{ matrix.service }}:ci ./services/${{ matrix.service }}

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Build
        working-directory: web
        run: npm run build

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the backend stack
        # Excludes "web" — this job only exercises the API layer, no need
        # to spend time building the UI image here.
        run: docker compose up --build -d catalog-db collection-db activity-db pubsub-emulator catalog-service collection-service activity-service
      - name: Run end-to-end smoke test
        run: ./scripts/smoke-test.sh
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

  ui-test:
    # Playwright, driving the real browser against the real containerized
    # UI + full backend stack — the UI equivalent of smoke-test.sh. Proves
    # the distributed flow works the way an actual user would trigger it,
    # not just via direct API calls.
    needs: [smoke-test, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        working-directory: web
        run: npm ci
      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Start the full stack
        run: docker compose up --build -d
      - name: Wait for services to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8081/healthz > /dev/null && curl -sf http://localhost:8082/healthz > /dev/null && curl -sf http://localhost:5173 > /dev/null && exit 0
            sleep 2
          done
          echo "services never became ready"; exit 1
      - name: Run Playwright e2e suite
        working-directory: web
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

  perf-test:
    # Runs after smoke-test so functional correctness is already confirmed
    # before spending time on load — a real release gate, not just a
    # numbers-printer: k6 exits non-zero (failing this job, and the whole
    # pipeline) if the latency/error-rate thresholds defined in the scripts
    # aren't met.
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the backend stack
        run: docker compose up --build -d catalog-db collection-db activity-db pubsub-emulator catalog-service collection-service activity-service
      - name: Wait for services to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8081/healthz > /dev/null && curl -sf http://localhost:8082/healthz > /dev/null && exit 0
            sleep 2
          done
          echo "services never became ready"; exit 1
      - name: k6 — catalog-service API load test
        run: docker run --rm --network host -v ${{ github.workspace }}/scripts/k6:/scripts grafana/k6 run /scripts/catalog-load-test.js
      - name: k6 — end-to-end platform load test
        run: docker run --rm --network host -v ${{ github.workspace }}/scripts/k6:/scripts grafana/k6 run /scripts/collection-flow-load-test.js
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
